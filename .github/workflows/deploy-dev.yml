name: Deploy dev.flora.pm

on:
  push:
    branches: ["development"]

concurrency:
  group: dev-deployment-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  flora-server:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Invoke Ansible
        working-directory: deployment/
        run: |
          ansible-playbook -vvv \
            -i inventory.yaml \
            --extra-vars ansible_user=${{ secrets.ANSIBLE_USER }} \
            -e "ansible_port=${{ secrets.ANSIBLE_SSH_PORT }}" \
            playbooks/deploy-dev-server.yaml \
            --diff

  jobs-runner:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_JOBS_SSH_PRIVATE_KEY }}

      - name: Invoke Ansible
        working-directory: deployment/
        run: |
          ansible-playbook -vvv \
            -i inventory.yaml \
            --extra-vars ansible_user=${{ secrets.ANSIBLE_JOBS_USER }} \
            -e "ansible_port=${{ secrets.ANSIBLE_JOBS_SSH_PORT }}" \
            playbooks/deploy-dev-job-runner.yaml \
            --diff
