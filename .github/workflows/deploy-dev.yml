name: Deploy dev.flora.pm

on:
  push:
    branches: ["development"]

concurrency:
  group: dev-deployment-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  flora-server:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: assets/package-lock.json

      - name: Build frontend assets
        working-directory: assets/
        run: |
          npm clean-install
          npm run build

      - name: Archive frontend assets
        run: tar -czf static.tar.gz -C static .

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Invoke Ansible
        working-directory: deployment/
        run: |
          ansible-playbook -vvv \
            -i inventory.yaml \
            --extra-vars ansible_user=${{ secrets.ANSIBLE_USER }} \
            -e "ansible_port=${{ secrets.ANSIBLE_SSH_PORT }}" \
            -e "assets_archive=${{ github.workspace }}/static.tar.gz" \
            -e "deploy_sha=${{ github.sha }}" \
            playbooks/deploy-dev-server.yaml \
            --diff

  jobs-runner:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_JOBS_SSH_PRIVATE_KEY }}

      - name: Invoke Ansible
        working-directory: deployment/
        run: |
          ansible-playbook -vvv \
            -i inventory.yaml \
            --extra-vars ansible_user=${{ secrets.ANSIBLE_JOBS_USER }} \
            -e "ansible_port=${{ secrets.ANSIBLE_JOBS_SSH_PORT }}" \
            playbooks/deploy-dev-job-runner.yaml \
            --diff
