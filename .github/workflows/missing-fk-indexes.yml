name: Missing FK Indexes

on:
  pull_request:
  push:
    branches: ["main", "development"]

concurrency:
  group: missing-kf-indexes-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generateMatrix:
    name: "Generate matrix from cabal"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Extract the tested GHC versions
        id: set-matrix
        uses: kleidukos/get-tested@v0.1.9.1
        with:
          cabal-file: flora.cabal
          ubuntu-version: "24.04"
          version: 0.1.7.1

  missing-fk-index-check:
    needs: generateMatrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.generateMatrix.outputs.matrix) }}
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v6

    - name: Set up Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: "${{ matrix.ghc }}"
        cabal-version: "latest"

    - name: Configure environment
      run: |
        ./.github/workflows/setup.sh
        echo "/usr/lib/postgresql/14/bin/" >> $GITHUB_PATH
        echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
        echo "$HOME/.cabal/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/node_modules/.bin" >> $GITHUB_PATH
        cabal update

    - name: Cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('./.plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-


    - name: Migrate
      run: |
        set -x
        flora-cli createdb -c environment.ci.sh
cabal run -- flora-cli createdb -c environment.ci.sh
cabal run -- flora-cli migrate -c environment.ci.sh
      env:
        PGPASSWORD: "postgres"

    - name: Check
      run: |
        .github/workflows/check-missing-fk-indexes.sh
