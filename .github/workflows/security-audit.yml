name: Scan for vulnerabilities
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  haskell-security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.10.3'

      - name: Run Haskell Security Action
        uses: blackheaven/haskell-security-action@df18e40481ae37a2a023308720b701063a98157b # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # until MangoIV/cabal-audit#82 merges and republishes the MangoIV nightly
          binary_url: https://github.com/blackheaven/cabal-audit/releases/download/nightly/cabal-audit

