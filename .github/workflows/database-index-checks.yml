name: Database Index Checks

on:
  pull_request:
  push:
    branches: ["main", "development"]

concurrency:
  group: database-index-checks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  database-index-checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v6

    - name: Set up Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: "9.10.3"
        cabal-version: "latest"

    - name: Configure environment
      run: |
        ./.github/workflows/setup.sh
        echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
        echo "$HOME/.cabal/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/node_modules/.bin" >> $GITHUB_PATH
        touch ~/.pgpass
        chmod 0600 ~/.pgpass
        cabal update

    - name: Create freeze file
      run: cabal freeze --enable-tests

    - name: Cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('./dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-9.10.3-

    - name: Migrate
      run: |
        set -x
        cabal run -- flora-cli -c environment.ci.kdl create-db
        cabal run -- flora-migrate -c environment.ci.kdl
      env:
        PGPASSWORD: "postgres"

    - name: Check missing FK indexes
      run: .github/workflows/check-missing-fk-indexes.sh
      env:
        FLORA_DB_CONNSTRING: "postgresql://postgres:postgres@localhost/flora_test"

    - name: Check duplicate indexes
      run: .github/workflows/check-duplicate-indexes.sh
      env:
        FLORA_DB_CONNSTRING: "postgresql://postgres:postgres@localhost/flora_test"
