name: Backend tests

on:
  pull_request:
  push:
    branches: ["main", "development"]

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Backend_tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v6

    - name: Set up Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: "9.10.3"
        cabal-version: "latest"

    - name: Configure environment
      run: |
        ./.github/workflows/setup.sh
        echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
        echo "$HOME/.cabal/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/node_modules/.bin" >> $GITHUB_PATH
        echo "STORE_PATH=$(cabal -v0 path --store-dir)" >> $GITHUB_ENV
        cabal update
        mkdir -p ~/.local/share
        git clone https://github.com/haskell/security-advisories.git ~/.local/share/security-advisories

    - name: Create freeze file
      run: cabal freeze --enable-tests

    - name: Cache
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('./dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-9.10.3-

    - name: Build
      run: |
        cabal install postgresql-migration
        make build

    - name: Test
      run: |
        set -x
        make db-test-setup
        cabal run -- flora-cli -c environment.ci.kdl create-user --username "hackage-user" --email "tech@flora.pm" --password "foobar2000"
        make test
