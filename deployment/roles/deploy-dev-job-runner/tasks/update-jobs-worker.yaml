---

- name: "Update development branch"
  ansible.builtin.command:
    cmd: git checkout development
    chdir: dev/flora-jobs-runner

- name: "Update development branch"
  ansible.builtin.command:
    cmd: git pull
    chdir: dev/flora-jobs-runner

- name: "Clear staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.new"
    state: absent

- name: "Create staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.new"
    state: directory

- name: "Upload frontend assets"
  ansible.builtin.copy:
    src: "{{ assets_archive }}"
    dest: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.tar.gz"

- name: "Unpack frontend assets"
  ansible.builtin.command:
    cmd: tar -xzf static.tar.gz -C static.new
    chdir: dev/flora-jobs-runner

- name: "Remove frontend assets archive"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.tar.gz"
    state: absent

- name: "Clean build artifacts"
  ansible.builtin.command:
    cmd: gmake clean
    chdir: dev/flora-jobs-runner
  environment:
    PATH: "/home/ouranos/.cabal/bin:/home/ouranos/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Update cabal index"
  ansible.builtin.command:
    cmd: cabal update
    chdir: dev/flora-jobs-runner
  environment:
    PATH: "/home/ouranos/.cabal/bin:/home/ouranos/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Build backend"
  register: build
  ansible.builtin.command:
    cmd: cabal build --no-semaphore exe:flora-jobs-runner
    chdir: dev/flora-jobs-runner
  async: 3600
  poll: 30
  environment:
    PATH: "/home/ouranos/.cabal/bin:/home/ouranos/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Schema migrations"
  register: build
  ansible.builtin.shell:
    cmd: gmake db-migrate
    chdir: dev/flora-jobs-runner
  args:
    executable: /usr/local/bin/bash
  async: 3600
  poll: 30
  environment:
    PATH: "/home/ouranos/.cabal/bin:/home/ouranos/.ghcup/bin:{{ ansible_env.PATH }}"

- debug: msg="{{ build.stdout }}"
- debug: msg="{{ build.stderr }}"

- name: "Swap in new frontend assets"
  ansible.builtin.shell:
    cmd: rm -rf static.old && { [ ! -e static ] || mv static static.old; } && mv static.new static
    chdir: dev/flora-jobs-runner

- name: Kill the process
  ansible.builtin.shell:
    cmd: kill $(cat ~/.local/run/flora-jobs-runner.pid)
    chdir: dev/flora-jobs-runner
