---

- name: "Fetch development branch"
  ansible.builtin.command:
    cmd: git fetch origin development
    chdir: dev/flora-jobs-runner

- name: "Check out deployed commit"
  ansible.builtin.command:
    cmd: "git checkout --detach {{ deploy_sha }}"
    chdir: dev/flora-jobs-runner

- name: "Clear staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.new"
    state: absent

- name: "Create staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.new"
    state: directory

- name: "Upload frontend assets"
  ansible.builtin.copy:
    src: "{{ assets_archive }}"
    dest: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.tar.gz"

- name: "Unpack frontend assets"
  ansible.builtin.command:
    cmd: tar -xzf static.tar.gz -C static.new
    chdir: dev/flora-jobs-runner

- name: "Remove frontend assets archive"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/static.tar.gz"
    state: absent

- name: "Clear staging directory for executables"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/bin.new"
    state: absent

- name: "Create staging directory for executables"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/bin.new"
    state: directory

- name: "Upload executables"
  ansible.builtin.copy:
    src: "{{ binaries_archive }}"
    dest: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/flora-freebsd-amd64.tar.gz"

- name: "Unpack executables"
  ansible.builtin.command:
    cmd: tar -xzf flora-freebsd-amd64.tar.gz -C bin.new
    chdir: dev/flora-jobs-runner

- name: "Remove executables archive"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/flora-freebsd-amd64.tar.gz"
    state: absent

- name: "Remove the local cabal build directory"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/dev/flora-jobs-runner/dist-newstyle"
    state: absent

- name: "Schema migrations"
  register: migrate
  ansible.builtin.command:
    cmd: ./bin.new/flora-migrate -c flora.kdl
    chdir: dev/flora-jobs-runner
  async: 600
  poll: 15

- debug: msg="{{ migrate.stdout }}"
- debug: msg="{{ migrate.stderr }}"

- name: "Swap in new executables"
  ansible.builtin.shell:
    cmd: rm -rf bin.old && { [ ! -e bin ] || mv bin bin.old; } && mv bin.new bin
    chdir: dev/flora-jobs-runner

- name: "Swap in new frontend assets"
  ansible.builtin.shell:
    cmd: rm -rf static.old && { [ ! -e static ] || mv static static.old; } && mv static.new static
    chdir: dev/flora-jobs-runner

- name: Kill the process
  ansible.builtin.shell:
    cmd: kill $(cat ~/.local/run/flora-jobs-runner.pid)
    chdir: dev/flora-jobs-runner
