---

- name: "Fetch development branch"
  ansible.builtin.command:
    cmd: git fetch origin development
    chdir: flora-dev

- name: "Check out deployed commit"
  ansible.builtin.command:
    cmd: "git checkout --detach {{ deploy_sha }}"
    chdir: flora-dev

- name: "Clear staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/flora-dev/static.new"
    state: absent

- name: "Create staging directory for frontend assets"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/flora-dev/static.new"
    state: directory

- name: "Upload frontend assets"
  ansible.builtin.copy:
    src: "{{ assets_archive }}"
    dest: "{{ ansible_env.HOME }}/flora-dev/static.tar.gz"

- name: "Unpack frontend assets"
  ansible.builtin.command:
    cmd: tar -xzf static.tar.gz -C static.new
    chdir: flora-dev

- name: "Remove frontend assets archive"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/flora-dev/static.tar.gz"
    state: absent

- name: "Remove documentation build"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/flora-dev/docs/build"
    state: absent

- name: "Clean build artifacts"
  ansible.builtin.command:
    cmd: gmake clean
    chdir: flora-dev
  environment:
    PATH: "/home/dev-web-1/.cabal/bin:/home/dev-web-1/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Update cabal index"
  ansible.builtin.command:
    cmd: cabal update
    chdir: flora-dev
  environment:
    PATH: "/home/dev-web-1/.cabal/bin:/home/dev-web-1/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Build backend"
  register: build
  ansible.builtin.command:
    cmd: cabal build --no-semaphore
    chdir: flora-dev
  async: 3600
  poll: 30
  environment:
    PATH: "/home/dev-web-1/.cabal/bin:/home/dev-web-1/.ghcup/bin:{{ ansible_env.PATH }}"

- name: "Schema migrations"
  register: build
  ansible.builtin.shell:
    cmd: gmake db-migrate
    chdir: flora-dev
  args:
    executable: /usr/local/bin/bash
  async: 120
  poll: 30
  environment:
    PATH: "/home/dev-web-1/.cabal/bin:/home/dev-web-1/.ghcup/bin:{{ ansible_env.PATH }}"

- debug: msg="{{ build.stdout }}"
- debug: msg="{{ build.stderr }}"

- name: "Swap in new frontend assets"
  ansible.builtin.shell:
    cmd: rm -rf static.old && { [ ! -e static ] || mv static static.old; } && mv static.new static
    chdir: flora-dev

- name: Kill the process
  ansible.builtin.shell:
    cmd: kill $(cat ~/.local/run/flora-server.pid)
    chdir: flora-dev
