services:
  devel:
    image: $USER-flora-devel
    pull_policy: never
    build:
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    ports:
      - "8084:8084"
      - "8085:8085"
    expose:
      - "8084"
    volumes:
      - database-data:/flora-server/pgdata/
      - .:/flora-server:Z
      - home-data:/home/$USER/
      # Shared with the live-eventlog forwarder;
      # This path is configured in the `eventlogSocketDirectory` configuration.
      - eventlog-socket:/tmp/flora-eventlog
    links:
      - flora-database
    environment:
      - CONFIG=environment.docker.kdl
    command: sleep infinity
    profiles:
      - local
    depends_on:
      - flora-database

  flora-database:
    image: docker.io/library/postgres:17.9
    container_name: flora-database
    command: postgres -c 'max_connections=250'
    user: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    expose:
      - "5432"
    env_file:
      - database.env
    volumes:
      - database-data:/var/lib/postgresql/data
    profiles:
      - local

  prometheus:
    image: "prom/prometheus:v3.13.1"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    expose:
      - "9090"
    profiles:
      - local
      - live-eventlog
  jaeger:
    image: jaegertracing/jaeger:2.18.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: debug
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
    profiles:
      - local

  # Live eventlog profiling stack (profile: live-eventlog).
  # See the "Live Eventlogs" section of CONTRIBUTING.md for usage.
  eventlog-live-otlp-server:
    image: flora-eventlog-live-otlp
    build:
      context: "."
      dockerfile: "Dockerfile.eventlog-live-otlp"
    restart: "unless-stopped"
    depends_on:
      eventlog-otelcol:
        condition: "service_started"
    volumes:
      - "${FLORA_EVENTLOG_DIR:-eventlog-socket}:/run/flora"
      - "./deployment/eventlog-live/eventlog-live-otlp.yaml:/etc/eventlog-live-otlp/config.yaml"
    environment:
      OTEL_SERVICE_NAME: "flora-server"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eventlog-otelcol:4318"
      OTEL_TRACES_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROFILES_EXPORTER: "none"
    command:
      - "--config=/etc/eventlog-live-otlp/config.yaml"
      - "--eventlog-socket=/run/flora/flora-server.sock"
      - "-hi"
      - "--eventlog-flush-interval=1"
      - "--eventlog-socket-timeout=5"
    profiles:
      - live-eventlog

  eventlog-live-otlp-jobs:
    image: flora-eventlog-live-otlp
    build:
      context: "."
      dockerfile: "Dockerfile.eventlog-live-otlp"
    restart: "unless-stopped"
    depends_on:
      eventlog-otelcol:
        condition: "service_started"
    volumes:
      - "${FLORA_EVENTLOG_DIR:-eventlog-socket}:/run/flora"
      - "./deployment/eventlog-live/eventlog-live-otlp.yaml:/etc/eventlog-live-otlp/config.yaml"
    environment:
      OTEL_SERVICE_NAME: "flora-jobs-runner"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eventlog-otelcol:4318"
      OTEL_TRACES_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROFILES_EXPORTER: "none"
    command:
      - "--config=/etc/eventlog-live-otlp/config.yaml"
      - "--eventlog-socket=/run/flora/flora-jobs-runner.sock"
      - "-hi"
      - "--eventlog-flush-interval=1"
      - "--eventlog-socket-timeout=5"
    profiles:
      - live-eventlog

  eventlog-otelcol:
    image: "otel/opentelemetry-collector-contrib:0.140.1"
    restart: "unless-stopped"
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - "./deployment/eventlog-live/compose/otelcol.yaml:/etc/otelcol/config.yaml"
    profiles:
      - live-eventlog

  eventlog-grafana:
    image: "grafana/grafana:13.1.1"
    restart: "unless-stopped"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - "./deployment/eventlog-live/compose/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml"
      - "./deployment/eventlog-live/compose/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml"
      - "./deployment/dashboards:/var/lib/grafana/dashboards"
    ports:
      - "127.0.0.1:${FLORA_GRAFANA_PORT:-3000}:3000"
    profiles:
      - live-eventlog

volumes:
  database-data:
  home-data:
  eventlog-socket:
