global:
  scrape_interval: 10s
scrape_configs:
 - job_name: prometheus
   static_configs:
    - targets:
       - prometheus:9090

 - job_name: flora-server
   static_configs:
    - targets:
       - devel:8084
 - job_name: flora-jobs
   static_configs:
    - targets:
       - devel:8085

 - job_name: otelcol
   scrape_interval: 1s
   honor_labels: true
   static_configs:
    - targets:
       - eventlog-otelcol:9090
